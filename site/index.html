<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DET Prep">
<title>DET Prep · Obed</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="hdr" id="hdr">
  <span class="title" id="hdrTitle">DET Prep</span>
  <span class="badge" id="streak" aria-label="Série de jours">🔥 0</span>
</header>

<main>
  <section id="p-today" class="on"></section>
  <section id="p-path"></section>
  <section id="p-exam"></section>
  <section id="p-progress"></section>
  <section id="p-more"></section>
</main>

<!-- Lecteur d'exercice plein écran -->
<div class="runner" id="runner" role="dialog" aria-modal="true">
  <div class="rhead">
    <button class="icbtn" id="rClose" aria-label="Fermer">✕</button>
    <div class="prog"><i id="rProg" style="width:0"></i></div>
    <span class="timer" id="rTimer"></span>
  </div>
  <div class="rbody" id="rBody"></div>
  <div class="rfoot" id="rFoot"></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast" role="status"></div>

<nav class="tabs" id="tabs">
  <button data-tab="today" class="on" aria-label="Aujourd'hui"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>Aujourd'hui</button>
  <button data-tab="path" aria-label="Parcours"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5"/></svg>Parcours</button>
  <button data-tab="exam" aria-label="Examen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Examen</button>
  <button data-tab="progress" aria-label="Progrès"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progrès</button>
  <button data-tab="more" aria-label="Plus"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>Plus</button>
</nav>

<script src="js/data/fib.js"></script>
<script src="js/data/rac.js"></script>
<script src="js/data/faults.js"></script>
<script src="js/data/cognates.js"></script>
<script src="js/data/test.js"></script>
<script src="js/data/scenes.js"></script>
<script src="js/data/prod.js"></script>
<script src="js/data/listening.js"></script>
<script src="js/data/ireading.js"></script>
<script src="js/core.js"></script>
<script src="js/ai.js"></script>
<script src="js/modules/ctest.js"></script>
<script src="js/modules/faults.js"></script>
<script src="js/modules/cognates.js"></script>
<script src="js/modules/review.js"></script>
<script src="js/modules/prod.js"></script>
<script src="js/modules/writing.js"></script>
<script src="js/modules/speaking.js"></script>
<script src="js/modules/listening.js"></script>
<script src="js/modules/ireading.js"></script>
<script src="js/today.js"></script>
<script src="js/pages.js"></script>
<script>App.boot()</script>
</body>
</html>
